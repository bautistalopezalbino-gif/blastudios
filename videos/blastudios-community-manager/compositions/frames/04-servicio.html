  <script>
    (function () {
      var root = document.querySelector('[data-composition-id="04-servicio"]');
      var q = function (sel) {
        return root.querySelector(sel);
      };

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      /* ─────────────────────────────────────────────────────────────
         Virtual camera (viewport-change): ONE .world wrapper, one cam
         object, one writer. Scenes 1-6 sit at authored scale with an
         imperceptible push-in; Scene 7 is the short decelerated
         pull-back that frames all four cards and locks.
         ───────────────────────────────────────────────────────────── */
      var world = q('#servicio-04-world');
      var cam = { scale: 1, x: 0, y: 0 };
      function applyCamera() {
        world.style.transform =
          'translate(' + cam.x + 'px, ' + cam.y + 'px) scale(' + cam.scale + ')';
      }
      applyCamera(); // seed frame 0

      /* ══ Scene 1 (0.0–0.8s) — the blue light sweep: the hinge ══
         One finite pass, left → right, fully off-surface at both ends
         (ambient-glow-bloom, traveling-sweep form). */
      tl.fromTo(
        '#servicio-04-sweep',
        { x: -880 },
        { x: 1420, duration: 0.72, ease: 'none' },
        0
      );
      tl.fromTo(
        '#servicio-04-sweep',
        { opacity: 1 },
        { opacity: 0, duration: 0.24, ease: 'power1.in', immediateRender: false },
        0.56
      );

      // The blue field the sweep hands the frame over to — wiped in behind the light.
      var bluefield = q('#servicio-04-bluefield');
      var fieldWipe = { p: 0 };
      tl.fromTo(
        fieldWipe,
        { p: 0 },
        {
          p: 1,
          duration: 0.57,
          ease: 'power1.out',
          onUpdate: function () {
            bluefield.style.clipPath = 'inset(0 ' + (100 - fieldWipe.p * 100) + '% 0 0)';
          }
        },
        0.05
      );

      // The eyebrow is what the sweep leaves in its wake.
      var eyebrow = q('#servicio-04-eyebrow');
      var eyebrowWipe = { p: 0 };
      eyebrow.style.clipPath = 'inset(0 100% 0 0)'; // seed frame 0 explicitly
      tl.fromTo(
        eyebrowWipe,
        { p: 0 },
        {
          p: 1,
          duration: 0.28,
          ease: 'power2.out',
          immediateRender: false,
          onUpdate: function () {
            eyebrow.style.clipPath = 'inset(0 ' + (100 - eyebrowWipe.p * 100) + '% 0 0)';
          }
        },
        0.12
      );

      /* ══ Scene 2 (0.8–1.8s) — 60×4 accent rule + word-staggered headline ══ */
      tl.fromTo(
        '#servicio-04-accent',
        { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 0.45, ease: 'power3.out' },
        0.82
      );

      var words = root.querySelectorAll('.servicio-04-word');
      for (var w = 0; w < words.length; w++) {
        tl.fromTo(
          words[w],
          { opacity: 0, y: 40 },
          { opacity: 1, y: 0, duration: 0.55, ease: 'power3.out' },
          0.92 + w * 0.07
        );
      }

      /* ══ Scenes 3–6 — the four cards self-assemble and STAY ══
         spring-pop-entrance, calm settle: scale grow + short y rise on
         power3.out. No overshoot, no bounce, no exit, no dimming of the
         cards already on screen. */
      var CARD_AT = [1.82, 3.32, 4.72, 6.12];
      for (var c = 0; c < CARD_AT.length; c++) {
        var at = CARD_AT[c];
        var card = q('#servicio-04-card-' + (c + 1));
        var num = card.querySelector('.servicio-04-num');
        var title = card.querySelector('.servicio-04-title');
        var sub = card.querySelector('.servicio-04-sub');

        tl.fromTo(
          card,
          { scale: 0.78, opacity: 0, y: 30 },
          { scale: 1, opacity: 1, y: 0, duration: 0.62, ease: 'power3.out' },
          at
        );
        tl.fromTo(
          num,
          { scale: 0.4, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.45, ease: 'power3.out' },
          at + 0.08
        );
        tl.fromTo(
          title,
          { opacity: 0, x: 26 },
          { opacity: 1, x: 0, duration: 0.42, ease: 'power3.out' },
          at + 0.14
        );
        tl.fromTo(
          sub,
          { opacity: 0, x: 26 },
          { opacity: 1, x: 0, duration: 0.42, ease: 'power3.out' },
          at + 0.21
        );
      }

      /* ══ Camera: slow push-in under the assembly, then Scene 7's
            short decelerated zoom-OUT that frames the four at once ══ */
      tl.to(
        cam,
        { scale: 1.035, duration: 7.4, ease: 'none', onUpdate: applyCamera },
        0
      );
      tl.to(
        cam,
        { scale: 0.95, y: -28, duration: 0.92, ease: 'power3.out', onUpdate: applyCamera },
        7.4
      );
      /* 8.32 → 8.5s: locked. The four cards are legible and un-dimmed — the pause frame. */

      /* ══ Persistent chrome — progress bar 46.67% → 75.0%, linear ══ */
      tl.fromTo(
        '#servicio-04-progress',
        { scaleX: 0.466667 },
        { scaleX: 0.75, duration: 8.5, ease: 'none' },
        0
      );

      window.__timelines['04-servicio'] = tl;
      tl.seek(0);
    })();
  </script>
