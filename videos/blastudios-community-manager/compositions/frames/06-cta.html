  <script>
    (function () {
      window.__timelines = window.__timelines || {};

      var root = document.querySelector('[data-composition-id="06-cta"]') || document;
      var q = function (sel) { return root.querySelector(sel); };

      var outline  = q('#frame-06-cta-icon-outline');
      var bar      = q('#frame-06-cta-icon-bar');
      var disc     = q('#frame-06-cta-icon-disc');
      var hole     = q('#frame-06-cta-icon-hole');
      var wipe     = q('#frame-06-cta-wipe');
      var tagline  = q('#frame-06-cta-tagline');
      var logo     = q('#frame-06-cta-logo');
      var headline = q('#frame-06-cta-headline');
      var hl1      = q('#frame-06-cta-hl-1');
      var hl2      = q('#frame-06-cta-hl-2');
      var pill     = q('#frame-06-cta-pill');
      var phone    = q('#frame-06-cta-phone');
      var glow     = q('#frame-06-cta-glow');
      var ring1    = q('#frame-06-cta-ring-1');
      var ring2    = q('#frame-06-cta-ring-2');
      var ring3    = q('#frame-06-cta-ring-3');
      var fill     = q('#frame-06-cta-progress-fill');

      // svg-path-draw: the dash pattern is MEASURED geometry, never a magic number.
      // Rounded-rect perimeter fallback = 2*(98+98) - 8*20 + 2*PI*20.
      var outlineLen = 2 * (98 + 98) - 8 * 20 + 2 * Math.PI * 20;
      if (outline && typeof outline.getTotalLength === 'function') {
        try {
          var measured = outline.getTotalLength();
          if (measured && isFinite(measured) && measured > 0) outlineLen = measured;
        } catch (e) { /* keep the computed fallback */ }
      }
      if (outline) {
        outline.style.strokeDasharray = outlineLen;
        outline.style.strokeDashoffset = outlineLen;
      }

      var tl = gsap.timeline({ paused: true });

      /* ── chrome: progress 90.0% → 100% across the frame, linear ───────── */
      tl.fromTo(fill,
        { scaleX: 0.9 },
        { scaleX: 1, duration: 3, ease: 'none' }, 0);

      /* ── SCENE 1 (0.0–0.9s) — the mark draws itself into dead centre ──── */
      // svg-path-draw: outer keyline strokes on, then the navy field fills behind it.
      tl.fromTo(outline,
        { strokeDashoffset: outlineLen },
        { strokeDashoffset: 0, duration: 0.38, ease: 'power2.out' }, 0.04);
      tl.fromTo(outline,
        { fillOpacity: 0 },
        { fillOpacity: 1, duration: 0.22, ease: 'power1.out' }, 0.30);
      // the vertical stroke of the mark draws bottom-up, then the disc closes it
      tl.fromTo(bar,
        { scaleY: 0, svgOrigin: '36 93' },
        { scaleY: 1, svgOrigin: '36 93', duration: 0.24, ease: 'power2.out' }, 0.24);
      tl.fromTo(disc,
        { scale: 0, svgOrigin: '61 76' },
        { scale: 1, svgOrigin: '61 76', duration: 0.24, ease: 'power3.out' }, 0.34);
      tl.fromTo(hole,
        { scale: 0, svgOrigin: '61 76' },
        { scale: 1, svgOrigin: '61 76', duration: 0.20, ease: 'power3.out' }, 0.44);
      // wordmark builds left→right behind an animated clip, tagline settles after
      tl.fromTo(wipe,
        { attr: { width: 0 } },
        { attr: { width: 335 }, duration: 0.32, ease: 'power2.out' }, 0.48);
      tl.fromTo(tagline,
        { opacity: 0 },
        { opacity: 1, duration: 0.26, ease: 'power1.out' }, 0.72);
      // the closing rings breathe up under the mark and then stay put
      tl.fromTo([ring3, ring2, ring1],
        { opacity: 0 },
        { opacity: 1, duration: 0.5, ease: 'power1.out', stagger: 0.07 }, 0.62);

      /* ── SCENE 2 (0.9–1.7s) — scale exchange: mark yields the centre ──── */
      // scale-swap-transition, adapted: the outgoing shrinks and RELOCATES
      // (it stays on as the signature) while the incoming pops into the vacated centre.
      tl.fromTo(logo,
        { scale: 1, y: 0 },
        { scale: 0.48, y: -404, duration: 0.52, ease: 'power2.inOut' }, 0.9);
      tl.fromTo(headline,
        { scale: 0.9 },
        { scale: 1, duration: 0.46, ease: 'power3.out' }, 1.24);
      tl.fromTo(hl1,
        { opacity: 0, y: 26 },
        { opacity: 1, y: 0, duration: 0.38, ease: 'power3.out' }, 1.24);
      tl.fromTo(hl2,
        { opacity: 0, y: 26 },
        { opacity: 1, y: 0, duration: 0.38, ease: 'power3.out' }, 1.33);

      /* ── SCENE 3 (1.7–2.5s) — the ask ─────────────────────────────────── */
      // spring-pop-entrance: single hero, scale 0 → 1, smooth long-tail settle.
      tl.fromTo(pill,
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.42, ease: 'power3.out' }, 1.72);
      tl.fromTo(phone,
        { opacity: 0, y: 16 },
        { opacity: 1, y: 0, duration: 0.32, ease: 'power3.out' }, 1.96);
      // the primary bloom flowers behind the pill and is fully settled at 2.50s
      tl.fromTo(glow,
        { opacity: 0, scale: 0.72 },
        { opacity: 1, scale: 1, duration: 0.34, ease: 'power2.out' }, 2.14);

      /* ── SCENE 4 (2.5–3.0s) — dead-still lockup. Nothing moves but the
            mandated progress fill reaching exactly 100% on the last frame. ─ */

      window.__timelines['06-cta'] = tl;
      tl.seek(0);
    })();
  </script>
