  <script>
    (function () {
      var ID = "05-diferencial";
      var q = function (sel) { return document.querySelector(sel); };

      var line1 = q("#f05-line-1");
      var line2 = q("#f05-line-2");
      var line3 = q("#f05-line-3");
      var persona = q("#f05-persona");
      var rulePath = q("#f05-rule-path");
      var proofLine = q("#f05-proof-line");
      var barFill = q("#f05-bar-fill");

      // svg-path-draw setup: dash pattern from the MEASURED path length, never a guess.
      var ruleLen = rulePath.getTotalLength() || 360;
      rulePath.style.strokeDasharray = String(ruleLen);
      rulePath.style.strokeDashoffset = String(ruleLen);

      var tl = gsap.timeline({ paused: true });

      // The ONE restrained move: slide-up + crossfade — the same gesture, same distance,
      // same ease, once per line. That sameness is what makes this shot read as a breather.
      var RISE = 38;
      var DUR = 0.72;
      var EASE = "power2.out";

      // Scene 1 (0.0-1.2s) — "IA para la velocidad."
      tl.fromTo(line1, { y: RISE, opacity: 0 }, { y: 0, opacity: 1, duration: DUR, ease: EASE }, 0.08);

      // Scene 2 (1.2-2.4s) — "Una persona real", same move, no variation.
      tl.fromTo(line2, { y: RISE, opacity: 0 }, { y: 0, opacity: 1, duration: DUR, ease: EASE }, 1.2);

      // Scene 3 (2.4-3.2s) — "para el criterio." closes the phrase; "persona real" resolves to primary.
      tl.fromTo(line3, { y: RISE, opacity: 0 }, { y: 0, opacity: 1, duration: DUR, ease: EASE }, 2.4);
      tl.fromTo(persona, { color: "#F5F5F7" }, { color: "#2563EB", duration: 0.55, ease: "power1.inOut" }, 2.62);

      // Scene 4 (3.2-4.5s) — the 1px rule self-draws, then the quiet proof line arrives.
      tl.fromTo(rulePath, { strokeDashoffset: ruleLen }, { strokeDashoffset: 0, duration: 0.56, ease: "power2.out" }, 3.2);
      tl.fromTo(proofLine, { y: 22, opacity: 0 }, { y: 0, opacity: 1, duration: 0.58, ease: EASE }, 3.46);

      // Persistent chrome — progress fill 75.0% -> 90.0% of canvas width, linear, no easing.
      tl.fromTo(
        barFill,
        { scaleX: 0.75, transformOrigin: "left center" },
        { scaleX: 0.90, transformOrigin: "left center", duration: 4.5, ease: "none" },
        0
      );

      // Everything has landed by 4.04s. The remaining 0.46s is dead still on purpose:
      // no camera drift, no breathing, no ambient float. The stillness IS the payload.

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
