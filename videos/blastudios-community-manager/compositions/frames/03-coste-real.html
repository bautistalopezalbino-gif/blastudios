<template>
  <style>
    @font-face { font-family: 'Inter'; font-style: normal; font-weight: 400; font-display: block; src: url('assets/fonts/inter-latin.woff2') format('woff2'); }
    @font-face { font-family: 'Inter'; font-style: normal; font-weight: 500; font-display: block; src: url('assets/fonts/inter-latin.woff2') format('woff2'); }
    @font-face { font-family: 'Inter'; font-style: normal; font-weight: 600; font-display: block; src: url('assets/fonts/inter-latin.woff2') format('woff2'); }
    @font-face { font-family: 'Space Grotesk'; font-style: normal; font-weight: 600; font-display: block; src: url('assets/fonts/space-grotesk-latin.woff2') format('woff2'); }
    @font-face { font-family: 'Space Grotesk'; font-style: normal; font-weight: 700; font-display: block; src: url('assets/fonts/space-grotesk-latin.woff2') format('woff2'); }

    #root {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      container-type: size;
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* ---- full-bleed ground (lowest track, never on #root) ---- */
    .f-03-coste-real-bg {
      position: absolute;
      inset: 0;
      background: #000000;
    }

    /* ---- persistent chrome: wordmark ---- */
    .f-03-coste-real-wordmark {
      position: absolute;
      left: 72px;
      top: 96px;
      right: auto;
      bottom: auto;
      width: auto;
      height: auto;
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      font-size: 34px;
      line-height: 1;
      letter-spacing: 0;
      color: #F5F5F7;
      opacity: 0.40;
    }

    /* ---- persistent chrome: progress bar ---- */
    .f-03-coste-real-bar {
      position: absolute;
      left: 0;
      right: 0;
      top: auto;
      bottom: 0;
      width: auto;
      height: 4px;
      background: rgba(37, 99, 235, 0.10);
    }
    .f-03-coste-real-bar-fill {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: #2563EB;
      transform-origin: 0% 50%;
      will-change: transform;
    }

    /* ---- content stage ---- */
    .f-03-coste-real-stage {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;

    .f-03-coste-real-hero {
      display: flex;

    .f-03-coste-real-num {
      display: block;
      width: 620px;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 420px;
      line-height: 0.84;
      letter-spacing: -0.03em;
      color: #F4BA95;
      font-variant-numeric: tabular-nums;
      transform-origin: 50% 50%;
      will-change: transform;
    }

    .f-03-coste-real-unit {
      margin-top: 6px;
      font-family: 'Space Grotesk', sans-serif;

      color: #F4BA95;

    }

    .f-03-coste-real-l2 {
      margin-top: 88px;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      font-size: 92px;

      letter-spacing: -0.02em;
      color: #F5F5F7;

    }

    .f-03-coste-real-l3 {
      margin-top: 4px;

      font-size: 140px;
      line-height: 1.12;
      letter-spacing: -0.02em;
      color: #F5F5F7;
      transform-origin: 50% 50%;
      will-change: transform;
      opacity: 0;
    }

    .f-03-coste-real-dot {
      display: inline-block;

    .f-03-coste-real-rule {
      display: block;
      margin-top: 104px;
      width: 560px;
      height: 2px;
      overflow: visible;
    }
    .f-03-coste-real-rule path {
      fill: none;
      stroke: #F4BA95;
      stroke-width: 1;
      opacity: 0.55;
    }

    .f-03-coste-real-support {
      margin-top: 40px;
      max-width: 720px;
      font-family: 'Inter', sans-serif;
      font-weight: 400;
      font-size: 36px;
      line-height: 1.5;
      letter-spacing: 0;
      color: #98989F;
      opacity: 0;
      will-change: transform;
    }
  </style>

  <div
    id="root"
    data-composition-id="03-coste-real"
    data-width="1080"
    data-height="1920"
  >
    <div
      class="clip f-03-coste-real-bg"
      data-start="0"
      data-duration="4"
      data-track-index="0"
    ></div>

    <div
      class="clip f-03-coste-real-stage"
      data-start="0"
      data-duration="4"
      data-track-index="1"
    >
      <div class="f-03-coste-real-hero" id="f-03-coste-real-hero">
        <span class="f-03-coste-real-num" id="f-03-coste-real-num">0</span>
        <span class="f-03-coste-real-unit" id="f-03-coste-real-unit">horas al mes</span>
      </div>

      <div class="f-03-coste-real-l2" id="f-03-coste-real-l2">que no dedicas</div>

      <div class="f-03-coste-real-l3" id="f-03-coste-real-l3">a vender<span class="f-03-coste-real-dot" id="f-03-coste-real-dot">.</span></div>

      <svg
        class="f-03-coste-real-rule"
        id="f-03-coste-real-rule"
        viewBox="0 0 560 2"
        preserveAspectRatio="none"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path id="f-03-coste-real-rule-path" d="M 0 1 L 560 1" />
      </svg>

      <div class="f-03-coste-real-support" id="f-03-coste-real-support">Y aun así publicas cuando puedes, no cuando toca</div>
    </div>

    <div
      class="clip f-03-coste-real-wordmark"
      data-start="0"
      data-duration="4"
      data-track-index="2"
    >blastudios</div>

    <div
      class="clip f-03-coste-real-bar"
      data-start="0"
      data-duration="4"
      data-track-index="3"
    >
      <div class="f-03-coste-real-bar-fill" id="f-03-coste-real-bar-fill"></div>
    </div>
  </div>

  <script>
    (function () {
      var DUR = 4;
      var tl = gsap.timeline({ paused: true });

      /* ---------------------------------------------------------------
         Persistent chrome — progress bar: seconds 10-14 of a 30s video,
         so the cobalt fill runs 33.33% -> 46.67%, linear, no easing.
         The wordmark is deliberately untweened (static all 4s).
      --------------------------------------------------------------- */
      tl.fromTo(
        "#f-03-coste-real-bar-fill",
        { scaleX: 0.333333 },
        { scaleX: 0.466667, duration: DUR, ease: "none" },
        0
      );

      /* ---------------------------------------------------------------
         Scene 1 (0.0-1.1s) — hard cut to an empty black field, then
         "90 horas al mes" scale-pops dead center in warn.
         spring-pop-entrance on the phrase + counting-dynamic-scale on
         the numeral (value counts while its transform scale grows).
      --------------------------------------------------------------- */
      tl.fromTo(
        "#f-03-coste-real-hero",
        { scale: 0.62, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.52, ease: "power3.out" },
        0.04
      );

      var numEl = document.getElementById("f-03-coste-real-num");
      var counter = { value: 0 };
      var COUNT_DUR = 0.8;
      var COUNT_EASE = "power3.out";

      tl.fromTo(
        counter,
        { value: 0 },
        {
          value: 90,
          duration: COUNT_DUR,
          ease: COUNT_EASE,
          onUpdate: function () {
            numEl.textContent = String(Math.round(counter.value));
          }
        },
        0.04
      );

      /* same position, same ease, same duration as the count: the number
         visibly grows as it lands (START_SIZE 231px / END_SIZE 420px) */
      tl.fromTo(
        "#f-03-coste-real-num",
        { scale: 0.55 },
        { scale: 1, duration: COUNT_DUR, ease: COUNT_EASE },
        0.04
      );

      tl.fromTo(
        "#f-03-coste-real-unit",
        { opacity: 0, y: 24 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        0.34
      );

      /* ---------------------------------------------------------------
         Scene 2 (1.1-2.0s) — "que no dedicas" arrives below by HARD CUT
         (no fade, no slide): the cifra starts reading as a sentence.
      --------------------------------------------------------------- */
      tl.fromTo(
        "#f-03-coste-real-l2",
        { opacity: 0 },
        { opacity: 1, duration: 0.01, ease: "none" },
        1.12
      );

      /* ---------------------------------------------------------------
         Scene 3 (2.0-2.9s) — "a vender." is the payoff: spring-pop,
         then a punctuation snap as the full stop fills to warn.
      --------------------------------------------------------------- */
      tl.fromTo(
        "#f-03-coste-real-l3",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.56, ease: "power3.out" },
        2.02
      );

      tl.fromTo(
        "#f-03-coste-real-dot",
        { color: "#F5F5F7" },
        { color: "#F4BA95", duration: 0.22, ease: "power2.out" },
        2.62
      );

      /* ---------------------------------------------------------------
         Scene 4 (2.9-4.0s) — a 1px rule draws itself left to right
         (svg-path-draw, measured length), the muted support line rises
         under it, and the shot holds dead still to the last frame.
      --------------------------------------------------------------- */
      var rulePath = document.getElementById("f-03-coste-real-rule-path");
      var ruleLen = rulePath.getTotalLength();
      rulePath.style.strokeDasharray = String(ruleLen);
      rulePath.style.strokeDashoffset = String(ruleLen);

      tl.fromTo(
        rulePath,
        { strokeDashoffset: ruleLen },
        { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" },
        2.88
      );

      tl.fromTo(
        "#f-03-coste-real-support",
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.46, ease: "power2.out" },
        2.98
      );

      window.__timelines = window.__timelines || {};
      window.__timelines["03-coste-real"] = tl;
      tl.seek(0);
    })();
  </script>
</template>
