<template>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>

  <style>
    /* ── Brand faces — real files shipped with the project ───────────────── */
    @font-face { font-family: 'Inter'; font-style: normal; font-weight: 400; font-display: block; src: url('assets/fonts/inter-latin.woff2') format('woff2'); }
    @font-face { font-family: 'Inter'; font-style: normal; font-weight: 500; font-display: block; src: url('assets/fonts/inter-latin.woff2') format('woff2'); }
    @font-face { font-family: 'Inter'; font-style: normal; font-weight: 600; font-display: block; src: url('assets/fonts/inter-latin.woff2') format('woff2'); }
    @font-face { font-family: 'Space Grotesk'; font-style: normal; font-weight: 600; font-display: block; src: url('assets/fonts/space-grotesk-latin.woff2') format('woff2'); }
    @font-face { font-family: 'Space Grotesk'; font-style: normal; font-weight: 700; font-display: block; src: url('assets/fonts/space-grotesk-latin.woff2') format('woff2'); }

    /* ── Frame root — styled by #root, never by a class ──────────────────── */
    #root {
      position: absolute;
      inset: 0;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      container-type: size;
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Every layer is a full-frame box. */
    #f01-bg,
    #f01-stage,
    #f01-chrome {
      position: absolute;
      inset: 0;
      width: 1080px;
      height: 1920px;
    }

    /* Layer 1 of 3 — pure black ground (full-bleed, on a clip, never on #root). */
    #f01-bg { background: #000000; }

    /* ── Eyebrow — the ONLY blue in the frame besides the progress bar ───── */
    #f01-eyebrow {
      position: absolute;
      top: 306px;
      left: 0;
      right: 0;
      z-index: 2;
      text-align: center;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 2.3cqw;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #2563EB;
      will-change: transform, opacity;
    }

    /* ── Headline — two lines, one typographic box ───────────────────────── */
    #f01-headline {
      position: absolute;
      top: 384px;
      left: 0;
      right: 0;
      z-index: 2;
      text-align: center;
    }
    .f01-line {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 7.75cqw;
      line-height: 1.08;
      letter-spacing: -0.02em;
      color: #F5F5F7;
      white-space: nowrap;
    }
    .f01-w {
      display: inline-block;
      transform-origin: 50% 50%;
      will-change: transform, opacity, filter;
    }

    /* ── The small connector line ────────────────────────────────────────── */
    #f01-small {
      position: absolute;
      top: 712px;
      left: 0;
      right: 0;
      z-index: 2;
      text-align: center;
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      font-size: 2.9cqw;
      letter-spacing: 0.04em;
      color: #98989F;
      will-change: opacity;
    }

    /* Layer 2 of 3 — the peach bloom, behind the digits. */
    #f01-glow {
      position: absolute;
      left: 90px;
      top: 510px;
      width: 900px;
      height: 900px;
      z-index: 0;
      pointer-events: none;
      transform-origin: 50% 50%;
      will-change: transform, opacity;
      background: radial-gradient(circle at 50% 50%,
        rgba(244, 186, 149, 0.55) 0%,
        rgba(244, 186, 149, 0.22) 34%,
        rgba(244, 186, 149, 0.06) 54%,
        rgba(244, 186, 149, 0) 70%);
    }

    /* Layer 3 of 3 — the timer. The hook. */
    #f01-timer-wrap {
      position: absolute;
      top: 820px;
      left: 0;
      right: 0;
      z-index: 2;
      text-align: center;
      transform-origin: 50% 50%;
      will-change: transform, opacity;
    }
    #f01-timer {
      display: inline-block;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 26cqw;
      line-height: 1;
      letter-spacing: -0.015em;
      color: #F4BA95;
      font-variant-numeric: tabular-nums lining-nums;
      font-feature-settings: "tnum" 1, "lnum" 1;
      transform-origin: 50% 50%;
      will-change: transform;
    }

    /* ── The payoff ──────────────────────────────────────────────────────── */
    #f01-payoff {
      position: absolute;
      top: 1258px;
      left: 0;
      right: 0;
      z-index: 2;
      text-align: center;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 7.75cqw;
      line-height: 1.08;
      letter-spacing: -0.02em;
      color: #F4BA95;
      white-space: nowrap;
      will-change: transform, opacity, filter;
    }

    /* ── Persistent chrome — identical in all six frames ─────────────────── */
    #f01-wordmark {
      position: absolute;
      left: 72px;
      top: 96px;
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      font-size: 34px;
      line-height: 1;
      letter-spacing: 0;
      color: #F5F5F7;
      opacity: 0.40;
    }
    #f01-progress-track {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 4px;
      background: rgba(37, 99, 235, 0.10);
      overflow: hidden;
    }
    #f01-progress-fill {
      position: absolute;
      left: 0;
      top: 0;
      width: 1080px;
      height: 4px;
      background: #2563EB;
      transform-origin: 0% 50%;
      will-change: transform;
    }
  </style>

  <div
    id="root"
    data-composition-id="01-hook-tres-horas"
    data-start="0"
    data-duration="4"
    data-width="1080"
    data-height="1920"
  >
    <!-- Ground -->
    <div id="f01-bg" class="clip" data-start="0" data-duration="4" data-track-index="0"></div>

    <!-- Shot -->
    <div id="f01-stage" class="clip" data-start="0" data-duration="4" data-track-index="1">
      <div id="f01-eyebrow">COMMUNITY MANAGER</div>

      <div id="f01-headline">
        <div class="f01-line" id="f01-line1"><span class="f01-w">Llevar</span> <span class="f01-w">tú</span> <span class="f01-w">el</span> <span class="f01-w">Instagram</span></div>
        <div class="f01-line" id="f01-line2">de tu negocio</div>
      </div>

      <div id="f01-small">te cuesta</div>

      <div id="f01-glow"></div>
      <div id="f01-timer-wrap"><span id="f01-timer">0:00</span></div>

      <div id="f01-payoff">3 horas al día</div>
    </div>

    <!-- Persistent chrome -->
    <div id="f01-chrome" class="clip" data-start="0" data-duration="4" data-track-index="2">
      <div id="f01-wordmark">blastudios</div>
      <div id="f01-progress-track"><div id="f01-progress-fill"></div></div>
    </div>
  </div>

  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      /* ── One tempo grid drives every onset (kinetic-beat-slam spine) ──── */
      var PULSE = 0.06;
      var B = {
        eyebrow: PULSE * 1,   // 0.06  · Scene 1
        line1:   PULSE * 4,   // 0.24  · Scene 1
        line2:   PULSE * 16,  // 0.96  · Scene 2 — hard cut
        small:   PULSE * 30,  // 1.80  · Scene 3
        timer:   PULSE * 32,  // 1.92  · Scene 3 — spring-pop
        count:   PULSE * 33,  // 1.98  · Scene 3 — the climb
        lock:    PULSE * 47,  // 2.82  · Scene 4 — it locks on 3:04
        payoff:  PULSE * 49   // 2.94  · Scene 4
      };
      var COUNT_DUR = B.lock - B.count;   // 0.84s
      var TARGET_SECONDS = 184;           // 3:04 — measured, not rounded
      var DIGIT_START_SCALE = 0.55;       // START_SIZE / END_SIZE

      /* ── Persistent chrome — progress bar, 0% → 13.33%, linear, no ease ── */
      tl.fromTo("#f01-progress-fill",
        { scaleX: 0 },
        { scaleX: 0.1333, duration: 4, ease: "none" },
        0
      );
      /* The wordmark is deliberately untouched: no entrance, no scale, no fade. */

      /* ══ Scene 1 (0.0–0.9s) — pure black; eyebrow + line 1 build by word ══ */
      tl.fromTo("#f01-eyebrow",
        { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 0.34, ease: "power2.out" },
        B.eyebrow
      );

      gsap.utils.toArray("#f01-line1 .f01-w").forEach(function (word, i) {
        tl.fromTo(word,
          { opacity: 0, scale: 1.26, filter: "blur(14px)" },
          { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.42, ease: "power4.out" },
          B.line1 + i * 0.075
        );
      });

      /* ══ Scene 2 (0.9–1.8s) — line 2 lands by hard cut; centre stays empty ══ */
      tl.fromTo("#f01-line2",
        { opacity: 0 },
        { opacity: 1, duration: 0.02, ease: "none" },
        B.line2
      );

      /* ══ Scene 3 (1.8–2.8s) — the small line, then the timer climbs ═════ */
      /* letter-spacing reflows text and snaps glyphs to integer device pixels,
         which stutters under the seek-by-frame capture engine. The tracking is
         held statically in CSS (0.04em) and the entrance rides a transform
         instead — the same short rise + fade the rest of the reel uses. */
      tl.fromTo("#f01-small",
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.34, ease: "expo.out" },
        B.small
      );

      /* Spring-pop entrance — smooth long-tail settle, no overshoot. */
      tl.fromTo("#f01-timer-wrap",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.42, ease: "power3.out" },
        B.timer
      );

      /* Faint peach bloom lands on the timer's settle — one beat, not two. */
      tl.fromTo("#f01-glow",
        { opacity: 0, scale: 0.86 },
        { opacity: 0.13, scale: 1, duration: 0.42, ease: "power2.out" },
        B.timer
      );

      /* Counting with dynamic scale: the value climbs while the digits grow.
         Deterministic — driven only by the timeline proxy, never a clock. */
      var timerEl = document.getElementById("f01-timer");
      var countState = { v: 0 };
      function fmtTime(raw) {
        var s = Math.round(raw);
        var m = Math.floor(s / 60);
        var r = s % 60;
        return m + ":" + (r < 10 ? "0" + r : String(r));
      }
      tl.fromTo(countState,
        { v: 0 },
        {
          v: TARGET_SECONDS,
          duration: COUNT_DUR,
          ease: "power3.out",
          onUpdate: function () { timerEl.textContent = fmtTime(countState.v); }
        },
        B.count
      );
      tl.fromTo("#f01-timer",
        { scale: DIGIT_START_SCALE },
        { scale: 1, duration: COUNT_DUR, ease: "power3.out" },
        B.count
      );

      /* ══ Scene 4 (2.8–4.0s) — it locks on 3:04, the bloom flowers, hold ══ */
      tl.fromTo("#f01-timer-wrap",
        { scale: 1 },
        { scale: 1.07, duration: 0.13, ease: "power2.out", immediateRender: false },
        B.lock
      );
      tl.fromTo("#f01-timer-wrap",
        { scale: 1.07 },
        { scale: 1, duration: 0.30, ease: "power2.out", immediateRender: false },
        B.lock + 0.13
      );

      /* Bloom-and-hold — no breathe: from here the shot is completely still. */
      tl.fromTo("#f01-glow",
        { opacity: 0.13, scale: 1 },
        { opacity: 0.40, scale: 1.12, duration: 0.50, ease: "power2.out", immediateRender: false },
        B.lock
      );

      tl.fromTo("#f01-payoff",
        { opacity: 0, y: 26, filter: "blur(10px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.44, ease: "circ.out" },
        B.payoff
      );

      window.__timelines["01-hook-tres-horas"] = tl;
      tl.seek(0);
    })();
  </script>
</template>
