<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- GSAP 3.14.2, servido desde el proyecto. El navegador headless del render no confia
     en la CA del proxy de salida, asi que la carga por CDN fallaba con
     ERR_CERT_AUTHORITY_INVALID y ningun timeline llegaba a construirse. El fichero
     local tiene el mismo SHA-384 que el integrity que declaraba el tag del CDN. -->
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000000;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="30"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="el-01-hook-tres-horas"
        class="scene"
        data-composition-id="01-hook-tres-horas"
        data-composition-src="compositions/frames/01-hook-tres-horas.html"
        data-start="0"
        data-duration="4.5"
        data-track-index="0"
      ></div>

      <div
        id="el-02-desglose-horas"
        class="scene"
        data-composition-id="02-desglose-horas"
        data-composition-src="compositions/frames/02-desglose-horas.html"
        data-start="4"
        data-duration="6.5"
        data-track-index="1"
      ></div>

      <div
        id="el-03-coste-real"
        class="scene"
        data-composition-id="03-coste-real"
        data-composition-src="compositions/frames/03-coste-real.html"
        data-start="10"
        data-duration="4.4"
        data-track-index="0"
      ></div>

      <div
        id="el-04-servicio"
        class="scene"
        data-composition-id="04-servicio"
        data-composition-src="compositions/frames/04-servicio.html"
        data-start="14"
        data-duration="9"
        data-track-index="1"
      ></div>

      <div
        id="el-05-diferencial"
        class="scene"
        data-composition-id="05-diferencial"
        data-composition-src="compositions/frames/05-diferencial.html"
        data-start="22.5"
        data-duration="5"
        data-track-index="0"
      ></div>

      <div
        id="el-06-cta"
        class="scene"
        data-composition-id="06-cta"
        data-composition-src="compositions/frames/06-cta.html"
        data-start="27"
        data-duration="3"
        data-track-index="1"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-hook-tres-horas", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 4);
        tl.fromTo("#el-02-desglose-horas", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 4);
        tl.to("#el-02-desglose-horas", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 10);
        tl.fromTo("#el-03-coste-real", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 10);
        tl.to("#el-03-coste-real", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 14);
        tl.fromTo("#el-04-servicio", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 14);
        tl.to("#el-04-servicio", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 22.5);
        tl.fromTo("#el-05-diferencial", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 22.5);
        tl.to("#el-05-diferencial", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 27);
        tl.fromTo("#el-06-cta", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 27);
        tl.to({}, { duration: 30 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
